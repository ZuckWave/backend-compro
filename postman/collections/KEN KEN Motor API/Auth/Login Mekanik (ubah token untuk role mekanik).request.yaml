$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{mekanik_email}}",
      "password": "{{mekanik_password}}",
      "device_name": "Postman KEN KEN Mekanik"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login mekanik berhasil', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.environment.set('token', body.token);
    language: text/javascript
order: 3000

$kind: http-request
url: "{{base_url}}/spare-parts?per_page=100"
method: GET
headers:
  Accept: application/json
queryParams:
  per_page: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Daftar spare part tersedia', () => pm.response.to.have.status(200));
      const rows = pm.response.json().data;
      const roller = rows.find((row) => row.code === 'CVT-RLR-10G');
      if (roller) pm.environment.set('spare_part_id', roller.id);
    language: text/javascript
order: 2000
